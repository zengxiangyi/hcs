# hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.isolate-internal-queries=true
spring.datasource.hikari.allow-pool-suspension=false
spring.datasource.hikari.read-only=false
spring.datasource.hikari.register-mbeans=false
spring.datasource.hikari.catalog=page
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# jpa
# 关闭数据库自动更新（不自动建表/改表）
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# jwt
# cors 允许的来源（逗号分隔）；开发/测试阶段取 *，生产环境确定 IP 后改为具体白名单
cors.allowed-origins=*
jwt.secret=Zm9vYmFyYmF6cXV4LW15LXNlY3JldC1rZXktZm9yLWp3dC0wLjEzLjAtc2lnbmluZy1hbmQtdmVyaWZ5aW5nLXRva2Vu
jwt.expiration-ms=86400000
jwt.issuer=baogang-info
# mybatis
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.baogang.info.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
#logger
logging.level.com.baogang.info.mapper=DEBUG
# JsonTool.print 走的 logger，缺省根级别为 INFO，不显式开 DEBUG 则无输出
logging.level.com.baogang.info.tool=DEBUG

# JPA / Hibernate SQL 打印（仅走 logger，避免 stdout 重复打印）
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# 关闭旧式 stdout 打印，防止与上面 logger 重复输出
spring.jpa.properties.hibernate.format_sql=false

